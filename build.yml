name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write sources
        run: |
          mkdir -p PhoneBot
          cat > PhoneBot/README.md <<'END_FILE_0'
          # Phone Bot (Android)

          Плавающая кнопка 🤖 открывает мини-чат. Ты пишешь команду, ИИ читает экран
          через службу специальных возможностей и нажимает/вводит/листает по шагам.

          ## Сборка
          1. Установи Android Studio, открой папку PhoneBot (File > Open).
          2. Подожди синхронизацию Gradle (при запросе обнови версии плагинов).
          3. Подключи телефон по USB (включи отладку) и нажми Run.

          ## Первый запуск
          1. В приложении вставь бесплатный API-ключ Google Gemini, нажми «Сохранить».
          2. «Открыть спец. возможности» > Phone Bot > включить.
             (Если Android блокирует: Настройки > Приложения > Phone Bot > ⋮ > «Разрешить ограниченные настройки».)
          3. Появится кнопка 🤖. Нажми её, напиши команду, нажми ▶. ■ останавливает бота.

          ## Ограничения
          - Лимит 25 шагов на команду (константа в Agent.kt).
          - Некоторые приложения (банки) блокируют чтение экрана.
          - Каждый шаг отправляет текст экрана в API Google Gemini: не используй с чувствительными данными.
          END_FILE_0
          mkdir -p PhoneBot/app
          cat > PhoneBot/app/build.gradle.kts <<'END_FILE_1'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.phonebot"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.phonebot"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          END_FILE_1
          mkdir -p PhoneBot/app/src/main
          cat > PhoneBot/app/src/main/AndroidManifest.xml <<'END_FILE_2'
